services:
  postgres:
    image: postgres:16
    container_name: corela15_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-corela15_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-corela15_core}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-corela15_admin} -d ${POSTGRES_DB:-corela15_core}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
