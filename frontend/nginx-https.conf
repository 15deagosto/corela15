# Configuración real de HTTPS, para activar cuando ya exista el
# certificado emitido por el AD CS interno. No se usa por defecto en el
# build de la imagen (nginx.conf, solo HTTP, sigue siendo lo que se
# empaqueta) -- este archivo se monta encima de
# /etc/nginx/conf.d/default.conf vía volumen en docker-compose.prod.yml
# una vez que /etc/nginx/certs/portal.crt y portal.key existen de verdad
# en el servidor (nginx falla al arrancar si el archivo de certificado
# no existe, por eso no puede ser el default del build).
#
# Reemplazar SERVER_NAME_REAL por el dominio real (ej.
# portal.cooperativa15deagosto.fin.ec) antes de usarlo.

server {
    listen 80;
    server_name SERVER_NAME_REAL;
    # Todo lo que llegue por HTTP se manda directo a HTTPS -- nunca se
    # sirve la app en claro si ya hay certificado real configurado.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name SERVER_NAME_REAL;

    ssl_certificate     /etc/nginx/certs/portal.crt;
    ssl_certificate_key /etc/nginx/certs/portal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8080/health;
    }
}
