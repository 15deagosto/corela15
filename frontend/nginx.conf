server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA real: cualquier ruta que no sea un archivo estático cae en
    # index.html, para que React Router resuelva la navegación del lado
    # del cliente (recargar /creditos, /socios, etc. no debe dar 404).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Todo lo que empiece con /api/ se reenvía al backend real, dentro de
    # la red interna de Docker Compose (nombre de servicio "backend").
    # Mismo origen que la página -- el navegador nunca ve un dominio ni
    # puerto distinto, así que no hace falta configurar CORS para esto.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://backend:8080/health;
    }

    # SignalR real (Comunicación Interna) -- bug real encontrado: esta
    # ruta nunca se agregó cuando se construyó el chat, así que el
    # WebSocket jamás llegó al backend en producción (caía en el bloque
    # `location /` de arriba, que devuelve 405 ante un POST de
    # negotiate) -- el chat funcionaba solo por el respaldo de polling
    # de 30s en la lista de canales, nunca en tiempo real dentro de una
    # conversación abierta. `proxy_http_version 1.1` + los headers
    # Upgrade/Connection son obligatorios para que nginx deje pasar el
    # handshake real de WebSocket, no solo el POST inicial de negotiate.
    location /hubs/ {
        proxy_pass http://backend:8080/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
