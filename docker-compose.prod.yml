services:
  postgres:
    image: postgres:16
    container_name: corela15_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    # Sin publicar 5432 al host -- solo el backend (misma red interna de
    # Docker) necesita hablarle. Reduce superficie de ataque real: nadie
    # desde fuera del servidor puede conectarse directo a Postgres.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: corela15_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Core: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      Jwt__Issuer: ${JWT_ISSUER:-Corela15}
      Jwt__Audience: ${JWT_AUDIENCE:-Corela15Api}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-480}
      Corela15__CorsOrigins__0: ${CORS_ORIGIN:?set CORS_ORIGIN in .env.prod, ej. https://core.cooperativa15deagosto.fin.ec}
      # Única excepción real y acotada a la regla de oro del proyecto (el
      # backend nunca se conecta a Softbank, salvo acá): solo la usa
      # ObligacionSyncService, protegido por Menu:estructuras-financieras +
      # Estructura:OF01 -- ningún otro endpoint del sistema la toca.
      # Credencial de SOLO LECTURA (siga_ro), nunca la de PII (cloudstudio).
      Softbank__ConnectionStringRo: ${SOFTBANK_CONNECTION_RO:-}
      # SSO real hacia CredVault (ver SsoController.cs) -- mismo valor que
      # SSO_SHARED_SECRET en el .env.prod de credvault-coac, nunca una
      # contraseña real. Vacío = el ícono sigue funcionando como enlace
      # externo simple, sin sesión automática.
      CredVault__SsoSecret: ${CREDVAULT_SSO_SECRET:-}
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: corela15_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    # Sin certificado real todavía: estas 2 líneas quedan comentadas y la
    # app sirve solo por HTTP (nginx.conf, ya probado). Una vez que exista
    # el certificado emitido por el AD CS interno en el servidor
    # (/opt/corela15/certs/portal.crt y portal.key), descomentar ambas
    # líneas y correr `docker compose -f docker-compose.prod.yml --env-file
    # .env.prod up -d frontend` -- solo reinicia ese contenedor, sin
    # rebuild ni tocar nada más.
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro
    #   - ./frontend/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
