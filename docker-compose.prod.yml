services:
  postgres:
    image: postgres:16
    container_name: corela15_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.prod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.prod}
    # Sin publicar 5432 al host -- solo el backend (misma red interna de
    # Docker) necesita hablarle. Reduce superficie de ataque real: nadie
    # desde fuera del servidor puede conectarse directo a Postgres.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: corela15_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Core: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET:?set JWT_SECRET in .env.prod}
      Jwt__Issuer: ${JWT_ISSUER:-Corela15}
      Jwt__Audience: ${JWT_AUDIENCE:-Corela15Api}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-480}
      Corela15__CorsOrigins__0: ${CORS_ORIGIN:?set CORS_ORIGIN in .env.prod, ej. https://core.cooperativa15deagosto.fin.ec}
      # Excepciones reales y acotadas a la regla de oro del proyecto (el
      # backend nunca se conecta a Softbank, salvo estas, cada una detrás
      # de su propio Menu/Estructura real): ObligacionSyncService (OF01),
      # B11Service (balance). Credencial de SOLO LECTURA (siga_ro), nunca
      # la de PII (cloudstudio) -- esa es la de abajo, aparte.
      Softbank__ConnectionStringRo: ${SOFTBANK_CONNECTION_RO:-}
      # Credencial NOMINAL (cloudstudio) -- la única con permiso de columna
      # para leer nombre/cédula reales. Usada solo por EmpleadoSyncService
      # (Menu:nomina) para traer los colaboradores reales de Softbank "tal
      # cual" -- nunca se usa para otra cosa. Mismo criterio de separación
      # ya aplicado en SIGA con .env.nominal.
      Softbank__ConnectionStringNominal: ${SOFTBANK_CONNECTION_NOMINAL:-}
      # SSO real hacia CredVault (ver SsoController.cs) -- mismo valor que
      # SSO_SHARED_SECRET en el .env.prod de credvault-coac, nunca una
      # contraseña real. Vacío = el ícono sigue funcionando como enlace
      # externo simple, sin sesión automática.
      CredVault__SsoSecret: ${CREDVAULT_SSO_SECRET:-}
      # Mensajería (WhatsApp) — WhatsApp Business Platform (Meta Cloud API),
      # ver WhatsAppCloudApiClient.cs. Vacío = el módulo queda "dormido"
      # (WhatsAppNoConfiguradoException, 422, mensaje claro) hasta que TI
      # verifique la cuenta de Meta Business Manager y cargue las
      # credenciales reales — no bloquea el resto del despliegue.
      WhatsApp__PhoneNumberId: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WhatsApp__AccessToken: ${WHATSAPP_ACCESS_TOKEN:-}
      WhatsApp__TemplateName: ${WHATSAPP_TEMPLATE_NAME:-aviso_cooperativa}
      WhatsApp__TemplateLanguage: ${WHATSAPP_TEMPLATE_LANGUAGE:-es}
      # Biblioteca de Documentos — dónde vive el archivo físico real (ver
      # FileSystemDocumentoStorageService.cs). Montado por CIFS real contra
      # el NAS de la cooperativa (WD My Cloud Pro 192.168.0.25, share
      # `corela15-documentos`, cuenta de servicio de dominio dedicada
      # `15DEAGOSTO\svc-corela15-docs` -- único usuario con Lectura/Escritura
      # sobre ese share, todo el resto del AD en Denegar acceso, ver volumen
      # `documentos_data` más abajo). El código de la app nunca cambia,
      # siempre escribe/lee sobre este mismo punto de montaje.
      Documentos__RutaAlmacenamiento: /app/documentos-nas
    volumes:
      - documentos_data:/app/documentos-nas
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: corela15_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    # Sin certificado real todavía: estas 2 líneas quedan comentadas y la
    # app sirve solo por HTTP (nginx.conf, ya probado). Una vez que exista
    # el certificado emitido por el AD CS interno en el servidor
    # (/opt/corela15/certs/portal.crt y portal.key), descomentar ambas
    # líneas y correr `docker compose -f docker-compose.prod.yml --env-file
    # .env.prod up -d frontend` -- solo reinicia ese contenedor, sin
    # rebuild ni tocar nada más.
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro
    #   - ./frontend/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  # Montaje CIFS real contra el NAS de la cooperativa. La contraseña de la
  # cuenta de servicio (NAS_DOCUMENTOS_PASSWORD) vive únicamente en
  # .env.prod del servidor -- nunca en este archivo ni en el repo.
  # Requiere `cifs-utils` instalado en el host (ya está, ver bitácora del
  # proyecto). `domain=` es obligatorio porque la cuenta es de dominio
  # (15DEAGOSTO), no una cuenta local del NAS.
  documentos_data:
    driver: local
    driver_opts:
      type: cifs
      o: "username=svc-corela15-docs,password=${NAS_DOCUMENTOS_PASSWORD:?set NAS_DOCUMENTOS_PASSWORD in .env.prod},domain=15DEAGOSTO,vers=3.0,sec=ntlmssp,uid=0,gid=0,file_mode=0664,dir_mode=0775,iocharset=utf8"
      device: "//192.168.0.25/corela15-documentos"
